name: Deploy via FTP no Servidor

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci --legacy-peer-deps

      - name: Compilar Projeto (Vite Build)
        run: npm run build

      - name: Criar .htaccess para Roteamento Multi-Páginas (Apache / Hostinger)
        run: |
          cat > dist/.htaccess << 'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Não reescrever se o arquivo ou diretório físico existir
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]

            # Mapeamento de Rotas Amigáveis (Clean URLs)
            RewriteRule ^painel/admin/?$ painel/admin/index.html [L]
            RewriteRule ^painel/?$ painel/index.html [L]
            RewriteRule ^links/?$ links/index.html [L]

            # Fallback geral
            RewriteRule ^ index.html [L]
          </IfModule>
          EOF

      - name: Tratar e Sanitizar Host FTP
        id: ftp_config
        run: |
          RAW_HOST="${{ secrets.FTP_HOST }}"
          # Remove prefixos como ftp://, ftps://, https://, barras finais, portas e espaços
          CLEAN_HOST=$(echo "$RAW_HOST" | sed -e 's|^[a-zA-Z]*://||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]')
          echo "server=$CLEAN_HOST" >> "$GITHUB_OUTPUT"
          echo "Host sanitizado com sucesso."

      - name: Deploy dos Arquivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.ftp_config.outputs.server }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          port: 21
          local-dir: dist/
          server-dir: public_html/
          timeout: 120000
          dangerous-clean-slate: false
          dry-run: false
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**

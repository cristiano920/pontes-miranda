<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Administrativo | Pontes Miranda Advogados</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../admin.css">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/png" href="../../assets/favicon_preto.png">
</head>
<body class="login-body">

    <div class="login-bg-glow"></div>

    <main class="login-card">
        <div class="login-header">
            <a href="/">
                <img src="../../assets/logo_prata.png" alt="Pontes Miranda Advogados" class="login-logo">
            </a>
            <h1 class="login-title">Painel Administrativo</h1>
            <p class="login-subtitle">Acesso restrito à gestão de tags e scripts</p>
        </div>

        <div id="loginAlert" class="alert-box alert-danger" style="display: none;">
            <i data-lucide="alert-circle" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
            <span id="loginAlertText">Credenciais inválidas.</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email" class="form-label">E-mail Corporativo</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-control" 
                    placeholder="seu.email@pontesmiranda.adv.br" 
                    required 
                    autocomplete="username"
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Senha</label>
                <div style="position: relative;">
                    <input 
                        type="password" 
                        id="password" 
                        class="form-control" 
                        placeholder="••••••••" 
                        required 
                        autocomplete="current-password"
                        style="padding-right: 42px;"
                    >
                    <button 
                        type="button" 
                        id="togglePasswordBtn" 
                        aria-label="Exibir ou ocultar senha"
                        style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--adm-text-muted); cursor: pointer; display: flex; align-items: center;"
                    >
                        <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitLoginBtn" class="btn btn-primary btn-block" style="margin-top: 26px;">
                <span id="btnText">Entrar no Painel</span>
                <span id="btnSpinner" class="spinner" style="display: none;"></span>
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px;">
            <a href="/" style="font-size: 0.84rem; color: var(--adm-text-muted); display: inline-flex; align-items: center; gap: 6px; transition: var(--transition-fast);">
                <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i> Voltar para o Site Principal
            </a>
        </div>
    </main>

    <script type="module">
        import { loginWithEmail, redirectIfAuthenticated } from '../auth.js';

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();

            // Redireciona caso já esteja com sessão ativa
            await redirectIfAuthenticated();

            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitLoginBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const alertBox = document.getElementById('loginAlert');
            const alertText = document.getElementById('loginAlertText');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');

            // Alternar visibilidade da senha
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePasswordBtn.innerHTML = isPassword 
                    ? '<i data-lucide="eye-off" style="width: 18px; height: 18px;"></i>' 
                    : '<i data-lucide="eye" style="width: 18px; height: 18px;"></i>';
                lucide.createIcons();
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) return;

                // Loading State
                submitBtn.disabled = true;
                btnText.style.display = 'none';
                btnSpinner.style.display = 'inline-block';

                const result = await loginWithEmail(email, password);

                if (result.success) {
                    // Redireciona para o painel principal
                    window.location.href = '/painel/';
                } else {
                    alertText.textContent = result.error;
                    alertBox.style.display = 'flex';
                    submitBtn.disabled = false;
                    btnText.style.display = 'inline-block';
                    btnSpinner.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
